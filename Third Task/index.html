

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .purple-bg { background-color: #7D5FFF; color: white; }
        .yellow-bg { background-color: #FFC75F; color: black; }
        .light-bg { background-color: #F3F3F3; }
        .img-fluid { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card light-bg">
                    <h5>Create and schedule content <span class="text-primary">quicker.</span></h5>
                    <img src="images/illustration-create-post.webp" class="img-fluid" alt="Create Post">
                    <button class="btn btn-warning mt-3">Create Post →</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card purple-bg text-center">
                    <h3>Social Media <span class="text-warning">10x</span> <em>Faster</em> with AI</h3>
                    <img src="images/illustration-five-stars.webp" class="img-fluid" alt="Five Stars">
                </div>
            </div>
            <div class="col-md-4">
                <div class="card light-bg">
                    <h5>Schedule to social media.</h5>
                    <img src="images/illustration-consistent-schedule.webp" class="img-fluid" alt="Consistent Schedule">
                </div>
            </div>
            <div class="col-md-4">
                <div class="card yellow-bg">
                    <h5>Write your content using AI.</h5>
                    <img src="images/illustration-ai-content.webp" class="img-fluid" alt="AI Content">
                </div>
            </div>
            <div class="col-md-4">
                <div class="card light-bg">
                    <h5>Manage multiple accounts and platforms.</h5>
                    <img src="images/illustration-multiple-platforms.webp" class="img-fluid" alt="Multiple Platforms">
                </div>
            </div>
            <div class="col-md-4">
                <div class="card yellow-bg">
                    <h5>Maintain a consistent posting schedule.</h5>
                    <img src="images/illustration-consistent-schedule.webp" class="img-fluid" alt="Consistent Schedule">
                </div>
            </div>
            <div class="col-md-6">
                <div class="card light-bg text-center">
                    <h5>>56% faster audience growth</h5>
                    <img src="images/illustration-audience-growth.webp" class="img-fluid" alt="Audience Growth">
                </div>
            </div>
            <div class="col-md-6">
                <div class="card purple-bg text-center">
                    <h5>Grow followers with non-stop content.</h5>
                    <img src="images/illustration-grow-followers.webp" class="img-fluid" alt="Grow Followers">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
